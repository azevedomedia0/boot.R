name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 lintian
      - run: make
      - run: make image deb
      - name: Lint the .deb
        run: lintian --no-tag-display-limit boot-r_*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: boot.R
          path: |
            bootR.efi
            bootR.img
            boot-r_*.deb
  boot-test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 qemu-system-x86 ovmf imagemagick
      - run: make image
      - name: Boot the USB image in QEMU and capture the menu
        run: |
          (sleep 40; echo "screendump menu.ppm"; sleep 2; echo quit) | \
            qemu-system-x86_64 -m 512 -bios /usr/share/ovmf/OVMF.fd -drive file=bootR.img,format=raw \
              -vga std -display none -monitor stdio
          convert menu.ppm menu.png
      - uses: actions/upload-artifact@v4
        with:
          name: boot-test-screenshot
          path: menu.png
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: boot-r.flatpak
          manifest-path: packaging/flatpak/io.bootr.BootR.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Check the installed app
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive boot-r.flatpak
          flatpak run --command=sh io.bootr.BootR -c 'file /app/share/boot-r/bootR.efi; ls -l /app/share/boot-r /app/bin; head -c 2 /app/share/boot-r/bootR.efi | od -An -c'
